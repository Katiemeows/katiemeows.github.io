<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <div class="site-frame">
      <header class="site-header">
        <div class="shell header-inner">
          <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ '/articles/' | relative_url }}"{% if page.url == '/articles/' %} aria-current="page"{% endif %}>Articles</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          </nav>
        </div>
      </header>

      <main id="content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="shell footer-inner">
          <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
        </div>
      </footer>
    </div>
  </body>
</html>
