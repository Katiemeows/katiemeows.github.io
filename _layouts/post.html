---
layout: default
---

<article class="post shell-narrow">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <a href="{{ '/about/' | relative_url }}">{{ site.title }}</a>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
